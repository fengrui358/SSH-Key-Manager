name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            ext: ''
          - os: windows-latest
            target: windows
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller (macOS)
        if: matrix.target == 'macos'
        run: |
          uv run pyinstaller --onedir --windowed \
            --name ssh-key-manager \
            --icon assets/icon.icns \
            --add-data "assets/icon.png:assets" \
            --hidden-import=paramiko \
            --hidden-import=nacl \
            --hidden-import=cryptography \
            src/ssh_key_manager/__main__.py
          # Ad-hoc sign the .app to reduce Gatekeeper friction
          codesign --sign - --force --deep dist/ssh-key-manager.app

      - name: Build with PyInstaller (Windows)
        if: matrix.target == 'windows'
        run: uv run pyinstaller --onefile --windowed --name ssh-key-manager.exe --icon assets/icon.ico --add-data "assets/icon.png;assets" --hidden-import=paramiko --hidden-import=nacl --hidden-import=cryptography src/ssh_key_manager/__main__.py

      - name: Package macOS .dmg
        if: matrix.target == 'macos'
        run: |
          mkdir -p dmg-root
          cp -R dist/ssh-key-manager.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "SSH Key Manager" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            dist/ssh-key-manager.dmg

      - name: Upload artifact (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-manager-macos
          path: dist/ssh-key-manager.dmg

      - name: Upload artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-manager-windows
          path: dist/ssh-key-manager.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SSH Key Manager v${{ steps.version.outputs.VERSION }}
          body: |
            ## SSH Key Manager v${{ steps.version.outputs.VERSION }}

            ### Downloads
            - **macOS**: `ssh-key-manager.dmg` — 打开后拖入 Applications 运行
            - **Windows**: `ssh-key-manager.exe` (Windows 10+)

            ### Usage
            1. Download the file for your platform
            2. **macOS**: open `.dmg` and drag `ssh-key-manager.app` to the `Applications` folder
               - First launch: **right-click the app > Open** (Gatekeeper will show a warning since the app is not notarized)
               - Alternatively, run in Terminal: `xattr -cr /Applications/ssh-key-manager.app && open /Applications/ssh-key-manager.app`
            3. **Windows**: double-click `ssh-key-manager.exe`
            4. On first launch you'll choose a data directory
            5. Place the data directory in OneDrive/iCloud for cross-device sync
          files: |
            artifacts/ssh-key-manager-macos/ssh-key-manager.dmg
            artifacts/ssh-key-manager-windows/ssh-key-manager.exe
          generate_release_notes: true
