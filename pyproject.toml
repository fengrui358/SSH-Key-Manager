[project]
name = "ssh-key-manager"
version = "0.5.0"
description = "Cross-platform portable SSH temporary key manager for AI assistant authorization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
ssh-key-manager = "ssh_key_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_key_manager"]
